<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifeAgent Mock Demo</title>
<style>body{margin:0;background:#f4f7f5;color:#20332b;font:16px system-ui}main{max-width:760px;margin:48px auto;padding:28px;background:white;border-radius:20px;box-shadow:0 12px 40px #1d3b2918}h1{margin-top:0}.sub{color:#718078}.chat{min-height:260px;padding:16px;background:#f7faf8;border-radius:14px;margin:20px 0}.msg{margin:12px 0;padding:12px 16px;border-radius:14px;max-width:80%;white-space:pre-wrap}.user{margin-left:auto;background:#d7f0df}.bot{background:#eaf0ec}form{display:flex;gap:10px}input{flex:1;padding:13px;border:1px solid #ccd9d0;border-radius:10px;font-size:16px}button{padding:0 20px;border:0;border-radius:10px;background:#2f7954;color:#fff;font-size:16px;cursor:pointer}.hint{font-size:13px;color:#7b8b82;margin-top:12px}</style></head>
<body><main><h1>LifeAgent · Mock Demo</h1><p class="sub">本页面使用确定性的 Mock 模型，不调用真实 API。</p><section id="chat" class="chat"><div class="msg bot">你好！可以试试“今天学习数学2小时，很累”或“我以前压力大时怎么调整？”</div></section><form><input id="input" autocomplete="off" placeholder="输入一条生活记录或问题…"><button>发送</button></form><p class="hint">Mock 链路：网页 → /api/v1/mock-chat → ChatService → MasterAgent → MemoryService</p></main>
<script>const chat=document.querySelector('#chat'),input=document.querySelector('#input');document.querySelector('form').onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;chat.insertAdjacentHTML('beforeend',`<div class="msg user">${text.replaceAll('&','&amp;').replaceAll('<','&lt;')}</div>`);input.value='';const r=await fetch('/api/v1/mock-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:10001,conversation_id:'demo',user_input:text})});const d=await r.json();chat.insertAdjacentHTML('beforeend',`<div class="msg bot">${(d.assistant_response||d.message||'请求失败').replaceAll('\n','<br>')}</div>`);chat.scrollTop=chat.scrollHeight};</script></body></html>
